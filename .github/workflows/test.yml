name: Tests and generated examples
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q -rs
      - run: python -m ruff check .
      - run: python tests/run_examples.py
      - run: node --check src/parametric_deco/resources/viewer.js
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxtst6 libxkbfile1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - run: python -m pip install -e ".[gui,dev]"
      - name: Check Qt native imports
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtWebEngineWidgets import QWebEngineView; print('Qt Widgets and WebEngine imports passed')"
      - run: python -m pytest tests/test_desktop_gui.py -q -rs
        env:
          DECO_GUI_TESTS: '1'
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
