name: Tests and generated examples
# Default checkout on pull_request tests the prospective merged result.
on:
  pull_request:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q -rs --junitxml="${{ runner.temp }}/pytest-python.xml"
      - name: Preserve Python test diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pytest-python
          path: ${{ runner.temp }}/pytest-python.xml
          if-no-files-found: ignore
      - run: python -m ruff check .
      - run: python tests/run_examples.py
      - run: node --check src/parametric_deco/resources/viewer.js
      - run: node --check src/parametric_deco/resources/projection.js
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxtst6 libxkbfile1 libnss3 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 xvfb xauth libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - run: python -m pip install -e ".[gui,dev]"
      - name: Check Qt native libraries and X11 startup
        run: |
          qt_plugin="$(python -c 'from PySide6.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.PluginsPath) + "/platforms/libqxcb.so")')"
          ldd "$qt_plugin"
          xvfb-run -a python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtWebEngineWidgets import QWebEngineView; app=QApplication([]); print('Qt platform:', app.platformName())"
        env:
          QT_QPA_PLATFORM: xcb
      - run: xvfb-run -a python -m pytest tests/test_desktop_gui.py -q -rs --junitxml="${{ runner.temp }}/pytest-desktop.xml"
        env:
          DECO_GUI_TESTS: '1'
          DECO_REQUIRE_WEBGL: '1'
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
          QSG_RHI_BACKEND: opengl
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: --use-gl=angle --use-angle=gl --ignore-gpu-blocklist --disable-dev-shm-usage --disable-features=Vulkan --disable-gpu-compositing
      - name: Preserve desktop test diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pytest-desktop
          path: ${{ runner.temp }}/pytest-desktop.xml
          if-no-files-found: ignore
